# Every pull request into dev or main is tested; so is every push to them.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Unit tests, and dist/ must be the build of src/ (dist/ is committed: the plugin runs it as installed).
      - run: npm run check
